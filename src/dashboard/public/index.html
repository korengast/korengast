<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agent Eval Dashboard</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        padding: 2rem;
      }

      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      h1 {
        color: white;
        margin-bottom: 2rem;
        font-size: 2.5rem;
      }

      .stats-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 1.5rem;
        margin-bottom: 2rem;
      }

      .stat-card {
        background: white;
        border-radius: 12px;
        padding: 1.5rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        transition: transform 0.3s ease;
      }

      .stat-card:hover {
        transform: translateY(-5px);
      }

      .stat-card h3 {
        color: #667eea;
        font-size: 0.9rem;
        font-weight: 600;
        text-transform: uppercase;
        margin-bottom: 0.5rem;
      }

      .stat-value {
        font-size: 2rem;
        font-weight: 700;
        color: #333;
        margin-bottom: 0.5rem;
      }

      .stat-details {
        font-size: 0.85rem;
        color: #666;
        line-height: 1.5;
      }

      .results-section {
        background: white;
        border-radius: 12px;
        padding: 2rem;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      }

      .results-section h2 {
        color: #333;
        margin-bottom: 1.5rem;
        font-size: 1.5rem;
      }

      .filter-group {
        margin-bottom: 1.5rem;
        display: flex;
        gap: 1rem;
        align-items: center;
      }

      select {
        padding: 0.5rem 1rem;
        border: 2px solid #e0e0e0;
        border-radius: 6px;
        font-size: 1rem;
        cursor: pointer;
      }

      .result-item {
        border: 1px solid #e0e0e0;
        border-radius: 8px;
        padding: 1.5rem;
        margin-bottom: 1rem;
        background: #f9f9f9;
      }

      .result-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 1rem;
      }

      .result-agent {
        font-weight: 600;
        color: #333;
      }

      .result-score {
        font-size: 1.25rem;
        font-weight: 700;
        color: #667eea;
      }

      .score-bar {
        background: #e0e0e0;
        height: 6px;
        border-radius: 3px;
        overflow: hidden;
        margin-bottom: 0.5rem;
      }

      .score-fill {
        background: linear-gradient(90deg, #667eea, #764ba2);
        height: 100%;
        transition: width 0.3s ease;
      }

      .result-details {
        font-size: 0.9rem;
        color: #666;
        margin-top: 0.5rem;
      }

      .loading {
        text-align: center;
        color: #666;
        padding: 2rem;
      }

      .error {
        color: #d32f2f;
        background: #ffebee;
        padding: 1rem;
        border-radius: 6px;
        margin-bottom: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>🤖 Agent Eval Dashboard</h1>

      <div class="stats-grid" id="statsGrid">
        <div class="loading">Loading statistics...</div>
      </div>

      <div class="results-section">
        <h2>Test Results</h2>
        <div class="filter-group">
          <label for="agentFilter">Filter by Agent:</label>
          <select id="agentFilter">
            <option value="">All Agents</option>
          </select>
        </div>
        <div id="resultsList">
          <div class="loading">Loading results...</div>
        </div>
      </div>
    </div>

    <script>
      async function loadStats() {
        try {
          const response = await fetch("/api/stats");
          const stats = await response.json();

          const grid = document.getElementById("statsGrid");
          grid.innerHTML = stats
            .map(
              (s) => `
            <div class="stat-card">
              <h3>${s.agent}</h3>
              <div class="stat-value">${(s.averageScore * 100).toFixed(1)}%</div>
              <div class="stat-details">
                <div>Tests: ${s.testCount}</div>
                <div>Range: ${(s.minScore * 100).toFixed(0)}% - ${(s.maxScore * 100).toFixed(0)}%</div>
              </div>
            </div>
          `
            )
            .join("");

          updateAgentFilter(stats.map((s) => s.agent));
        } catch (error) {
          console.error("Failed to load stats:", error);
        }
      }

      function updateAgentFilter(agents) {
        const filter = document.getElementById("agentFilter");
        agents.forEach((agent) => {
          const option = document.createElement("option");
          option.value = agent;
          option.textContent = agent;
          filter.appendChild(option);
        });
      }

      async function loadResults() {
        try {
          const agent = document.getElementById("agentFilter").value;
          const url = agent
            ? `/api/results?agent=${encodeURIComponent(agent)}`
            : "/api/results";
          const response = await fetch(url);
          const results = await response.json();

          const list = document.getElementById("resultsList");
          if (results.length === 0) {
            list.innerHTML = '<div class="loading">No results yet</div>';
            return;
          }

          list.innerHTML = results
            .map(
              (r) => `
            <div class="result-item">
              <div class="result-header">
                <span class="result-agent">${r.agentName} - ${r.testCaseId}</span>
                <span class="result-score">${(r.averageScore * 100).toFixed(1)}%</span>
              </div>
              <div class="score-bar">
                <div class="score-fill" style="width: ${r.averageScore * 100}%"></div>
              </div>
              <div class="result-details">
                Time: ${r.executionTimeMs}ms
              </div>
            </div>
          `
            )
            .join("");
        } catch (error) {
          console.error("Failed to load results:", error);
        }
      }

      document
        .getElementById("agentFilter")
        .addEventListener("change", loadResults);

      loadStats();
      loadResults();

      setInterval(loadStats, 5000);
      setInterval(loadResults, 5000);
    </script>
  </body>
</html>
